name: Run pytest tests on Windows

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Supported python versions'
        default: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]'
        required: false
        type: string
      postgresql:
        description: 'PostgreSQL version'
        required: true
        type: number
    secrets:
      codecov_token:
        description: 'Codecov token'
        required: false

jobs:
  postgres:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    env:
      OS: windows-latest
      PYTHON: ${{ matrix.python-version }}
      POSTGRES: ${{ inputs.postgresql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv with python ${{ matrix.python-version }}
        uses: fizyk/actions-reuse/.github/actions/uv-setup@42b61e053c1d70a61deb42b323c1a2229e2e7fe0 # v5.5.0
        with:
          python-version: ${{ matrix.python-version }}
      # ankane/setup-postgres publishes no tags/releases; v1 is a branch. Pinning
      # to a SHA gains nothing (Dependabot can't track a branch). Revisit if the
      # maintainer adds releases. See https://docs.zizmor.sh/audits/#unpinned-uses
      - uses: ankane/setup-postgres@v1 # zizmor: ignore[unpinned-uses]
        with:
          postgres-version: ${{ inputs.postgresql }}
      - uses: ./.github/actions/detect-pg-ctl
        with:
          postgresql-version: ${{ inputs.postgresql }}
      - uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
        with:
          pytest-opts: -svv -p no:xdist --postgresql-exec="${{ env.POSTGRESQL_EXEC }}" -k "not docker" --basetemp="${{ runner.temp }}/pytest-basetemp"
          data-file: .coverage.serial
          output-file: coverage-serial.xml
      - uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
        with:
          pytest-opts: -n auto --dist loadgroup --max-worker-restart 0 --postgresql-exec="${{ env.POSTGRESQL_EXEC }}" -k "not docker" --basetemp="${{ runner.temp }}/pytest-basetemp"
          coverage-config: .coveragerc
          data-file: .coverage.xdist
          output-file: coverage-xdist.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: postgresql-windows-${{ matrix.python-version }}-${{ inputs.postgresql }}
          path: ${{ runner.temp }}/pytest-basetemp/**
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.1
        with:
          token: ${{ secrets.codecov_token }}
          flags: unittests
          env_vars: OS,PYTHON
          fail_ci_if_error: false
          files: coverage-serial.xml,coverage-xdist.xml
