name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  postgresql_18:
    permissions:
      contents: read
    uses: $/.github/workflows/tests-linux.yml
    with:
      postgresql: 18
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  postgresql_oldest:
    needs: [postgresql_18]
    permissions:
      contents: read
    uses: $/.github/workflows/tests-oldest.yml
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  postgresql_17:
    needs: [postgresql_18]
    permissions:
      contents: read
    uses: $/.github/workflows/tests-linux.yml
    with:
      postgresql: 17
      python-versions: '["3.12", "3.13", "3.14", "3.15", "pypy-3.11"]'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  postgresql_16:
    needs: [postgresql_17]
    permissions:
      contents: read
    uses: $/.github/workflows/tests-linux.yml
    with:
      postgresql: 16
      python-versions: '["3.13", "3.14", "3.15"]'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  postgresql_15:
    needs: [postgresql_16]
    permissions:
      contents: read
    uses: $/.github/workflows/tests-linux.yml
    with:
      postgresql: 15
      python-versions: '["3.14", "3.15"]'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  postgresql_14:
    needs: [postgresql_15]
    permissions:
      contents: read
    uses: $/.github/workflows/tests-linux.yml
    with:
      postgresql: 14
      python-versions: '["3.14", "3.15"]'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  macos_postgres_18:
    needs: [postgresql_18]
    permissions:
      contents: read
    uses: $/.github/workflows/tests-macos.yml
    with:
      postgresql: 18
      python-versions: '["3.13", "3.14", "3.15"]'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  macos_postgres_17:
    needs: [postgresql_17, macos_postgres_18]
    permissions:
      contents: read
    uses: $/.github/workflows/tests-macos.yml
    with:
      postgresql: 17
      python-versions: '["3.13", "3.14", "3.15"]'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  macos_postgres_16:
    needs: [postgresql_16, macos_postgres_17]
    permissions:
      contents: read
    uses: $/.github/workflows/tests-macos.yml
    with:
      postgresql: 16
      python-versions: '["3.14", "3.15"]'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  windows_postgres_17:
    needs: [postgresql_17]
    permissions:
      contents: read
    uses: $/.github/workflows/tests-windows.yml
    with:
      postgresql: 17
      python-versions: '["3.13", "3.14", "3.15"]'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
