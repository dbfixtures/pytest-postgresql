name: Scheduled release

on:
  schedule:
    - cron: '13 7 4 * *'
  workflow_dispatch: {}

concurrency:
  group: release-schedule

jobs:
  schedule:
    permissions:
      contents: read
    uses: fizyk/actions-reuse/.github/workflows/shared-release-schedule.yml@06f5123d5a89db10f394aaa1533a5c119b34a48f # v5.10.1
    with:
      dependency-manager: 'uv'
      newsfragments-required: true
      minor-fragments: 'feature,depr'
      major-fragments: 'break'
    secrets:
      app_id: ${{ secrets.RELEASE_APP_ID }}
      private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
