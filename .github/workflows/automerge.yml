name: Merge me test dependencies!

on: # zizmor: ignore[dangerous-triggers] intentional: this workflow runs in the context of the base branch
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  automerge:
    permissions: {}
    cache-mode: none
    uses: fizyk/actions-reuse/.github/workflows/shared-automerge.yml@08f39ebc48d9ae96c2a257b83507ce64be455ae0 # v5.12.0
    secrets:
      client_id: ${{ secrets.MERGE_APP_CLIENT_ID }}
      private_key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
