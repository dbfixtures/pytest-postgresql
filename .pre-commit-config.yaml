---
ci:
  skip: [uv-sync, mypy]

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
minimum_pre_commit_version: 4.0.0
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-toml
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: mixed-line-ending
      - id: check-yaml
      - id: pretty-format-json
        args: [--autofix]
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --respect-gitignore, --show-fixes]
      - id: ruff-format

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 50e0f3aee9dc5747a5f173f79a7417403c18dda6  # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/rstcheck/rstcheck
    rev: 27a8027d6c6df787891a01b76e8298bac493fb58  # frozen: v6.3.0
    hooks:
      - id: rstcheck
        additional_dependencies: [sphinx, toml]

  - repo: https://github.com/fizyk/pyproject-validator
    rev: 4ec6447bfaa56ea3503cd9fa9ba6e54577121aaa  # frozen: v1.1.0
    hooks:
    -   id: check-python-version-consistency

  - repo: https://github.com/kjanat/actionlint
    rev: 2da2ceb4af2c7ecc48f5b9311d85080c3971b5f0  # frozen: v1.17.0
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: uv-sync
        stages: [pre-commit, manual]
        language: system
        name: Install dependencies for the local linters
        entry: uv sync
        types_or:
          - python
          - toml  # pyproject.toml
        pass_filenames: false
      - id: mypy
        stages: [pre-commit, manual]
        name: mypy
        entry: uv run mypy .
        language: system
        types_or:
          - python
          - toml  # pyproject.toml
        pass_filenames: false
