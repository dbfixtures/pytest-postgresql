---
ci:
  skip: [uv-sync, mypy, ty]

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
minimum_pre_commit_version: 4.0.0
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-toml
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: mixed-line-ending
      - id: check-yaml
      - id: pretty-format-json
        args: [--autofix]
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --respect-gitignore, --show-fixes]
      - id: ruff-format

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8  # frozen: v1.33.1
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 02ef6d1c28994054a843e58604e1a343faa42987  # frozen: v2.31.2
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/rstcheck/rstcheck
    rev: f10757576d6cfd0ac638cf0f0049c8b988ac553e  # frozen: v6.3.1
    hooks:
      - id: rstcheck
        additional_dependencies: [sphinx, toml]

  - repo: https://github.com/fizyk/pyproject-validator
    rev: 4ec6447bfaa56ea3503cd9fa9ba6e54577121aaa  # frozen: v1.1.0
    hooks:
    -   id: check-python-version-consistency

  - repo: https://github.com/kjanat/actionlint
    rev: 1a9278318c43b72cdf644214128fb0786d210147  # frozen: v1.17
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 96cf601960471a908938372419287b8f5d3df15b  # frozen: v0.0.109
    hooks:
      - id: ty

  - repo: local
    hooks:
      - id: uv-sync
        stages: [pre-commit, manual]
        language: system
        name: Install dependencies for the local linters
        entry: uv sync
        types_or:
          - python
          - toml  # pyproject.toml
        pass_filenames: false
      - id: mypy
        stages: [pre-commit, manual]
        name: mypy
        entry: uv run mypy .
        language: system
        types_or:
          - python
          - toml  # pyproject.toml
        pass_filenames: false
